<script>
(function(){const D=JSON.parse(document.getElementById('d').textContent),u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.v),additionalData:new TextEncoder().encode('mapa-fabricas-v1')},k,u(D.c));

document.open();document.write(txt);document.close();
}catch(x){m.textContent='Contraseña incorrecta o navegador no compatible.';}});})();
